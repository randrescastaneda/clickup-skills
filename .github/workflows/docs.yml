name: Documentation & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an active production publish. PRs have their own group.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the documentation source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Release metadata is refreshed against current main, never untrusted tag code.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install documentation build dependency
        run: python -m pip install -r site/requirements.txt
      - name: Set up installer test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check documentation impact for pull requests
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_docs_impact.py --base "$DOCS_BASE"
      - name: Check documentation impact for direct pushes
        if: github.event_name == 'push'
        env:
          DOCS_BASE: ${{ github.event.before }}
        run: python scripts/check_docs_impact.py --base "$DOCS_BASE"
      - name: Run plugin offline checks
        run: python scripts/check.py
      - name: Refresh published-release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_docs_release.py
      - name: Generate reference and build website
        run: python scripts/build_docs.py --release-json release-metadata.json
      - name: Verify the built website
        run: python scripts/check_docs.py
      - name: Upload verified GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
