[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickup-skills"
version = "0.1.0"
description = "Task-scoped ClickUp and GitHub workflows for coding agents"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
cu-work = "clickup_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
